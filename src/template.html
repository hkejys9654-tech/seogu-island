<title>서구 아일랜드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D island; title top-left, view toggle top-right, project card as bottom sheet (phone) / right panel (desktop). Single daytime world. */
:root{
  --sky-top:#9fd8f2; --sky-bottom:#e9f7fb; --ink:#23303b; --muted:#5f6f7c; --paper:rgba(255,255,255,.92); --paper-solid:#fffdf9;
  --line:rgba(35,48,59,.12); --orange:#ff7a21; --orange-deep:#d9590a; --sea:#3aa7c9;
  --c1:#ff7a21; --c2:#2f9e6e; --c3:#e0628a; --c4:#d23b3b;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(var(--sky-top),var(--sky-bottom));color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage canvas{display:block}
button{font-family:var(--body);color:var(--ink)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.top{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{padding:12px 16px 12px 14px;border-radius:20px;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(20,60,80,.14);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 150px)}
.brand img{width:40px;height:auto;flex:0 0 auto}
.brand h1{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;margin:0}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tbtn{border:0;border-radius:999px;padding:11px 15px;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(20,60,80,.14);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

.pin{position:fixed;z-index:3;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border:0;border-radius:999px;background:#fff;box-shadow:0 6px 18px rgba(20,60,80,.2);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.pin i{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;color:#fff;font-style:normal;font-family:var(--display);font-size:14px}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.pin.dim{opacity:.35}.pin.hidden{opacity:0;pointer-events:none}
/* 폰: 이름표 대신 숫자 동그라미만(겹치지 않게). 누르면 이름이 담긴 카드가 열림 */
.pin.mini{padding:5px;gap:0}.pin.mini span{display:none}.pin.mini i{width:30px;height:30px;font-size:16px}

.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding:8px 14px;border-radius:999px;background:rgba(35,48,59,.72);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.credit{position:fixed;z-index:4;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:11px;letter-spacing:.04em;color:var(--credit,rgba(35,48,59,.45));pointer-events:none}
/* 오른쪽 위 버튼 묶음: 보기 전환 + 소리 + (걷기 모드) 도움말 */
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools-row{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border:0;border-radius:50%;background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(20,60,80,.14);font-size:17px;font-weight:700;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn.on{background:#ffe7a8}
/* 걷기 모드 조작 안내 */
.howto{position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);width:min(330px,calc(100vw - 32px));box-sizing:border-box;padding:14px 16px 12px;border-radius:22px;background:var(--paper-solid);box-shadow:0 14px 40px rgba(20,60,80,.28);cursor:pointer;animation:pop .25s ease-out}
.howto b{display:block;font-family:var(--display);font-weight:400;font-size:18px;margin-bottom:8px}
.howto ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.howto li{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.45;word-break:keep-all}
.howto li i{flex:0 0 auto;display:grid;place-items:center;min-width:34px;height:28px;padding:0 6px;box-sizing:border-box;border-radius:9px;background:#fff1dc;color:var(--orange-deep);font-style:normal;font-size:12px;font-weight:700;white-space:nowrap}
.howto small{display:block;margin-top:9px;font-size:11px;color:var(--muted);text-align:center}

.card{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:62vh;overflow:auto;padding:18px 18px 16px;border-radius:26px;background:var(--paper-solid);box-shadow:0 18px 50px rgba(20,60,80,.28);transform:translateY(calc(100% + 30px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card.open{transform:none}
.card-head{display:flex;gap:14px;align-items:flex-start}
.card-head img{width:64px;height:auto;flex:0 0 auto;margin-top:-4px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent,var(--orange))}
.card h2{word-break:keep-all;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;margin:2px 0 4px;text-wrap:balance}
.card .one{word-break:keep-all;margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.x{margin-left:auto;flex:0 0 auto;width:36px;height:36px;border:0;border-radius:999px;background:#f1f3f4;font-size:18px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.chips span{padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--accent,#ff7a21) 12%,#fff);color:color-mix(in srgb,var(--accent,#ff7a21) 80%,#222);font-size:12px;font-weight:700}
.shot{display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;border-radius:18px;border:2px dashed color-mix(in srgb,var(--accent,#ff7a21) 45%,#fff);background:color-mix(in srgb,var(--accent,#ff7a21) 6%,#fff);color:var(--muted);font-size:13px;text-align:center;line-height:1.5}
.todo{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:#fff3c4;color:#8a6100;font-size:10px;font-weight:700;vertical-align:2px}
.actions{display:flex;gap:8px;margin-top:14px}
.go{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;padding:14px;border-radius:16px;background:var(--accent,var(--orange));color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.go.off{background:#e3e7ea;color:#7b8790;pointer-events:none}
.nav{flex:0 0 auto;width:52px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:18px;cursor:pointer}

.list{position:fixed;z-index:7;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 76px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background:linear-gradient(var(--sky-top),var(--sky-bottom))}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:960px;margin:0 auto}
.lcard{display:flex;gap:12px;align-items:center;padding:16px;border:0;border-radius:22px;background:#fff;box-shadow:0 8px 24px rgba(20,60,80,.12);text-align:left;cursor:pointer;min-width:0}
.lcard i{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff;font-style:normal;font-family:var(--display);font-size:22px}
.lcard b{display:block;font-size:16px}.lcard small{display:block;margin-top:2px;font-size:12px;color:var(--muted);line-height:1.45}
.lcard div{min-width:0}

.loading{position:fixed;z-index:9;inset:0;display:grid;place-items:center;background:linear-gradient(var(--sky-top),var(--sky-bottom));transition:opacity .5s}
.loading img{width:110px;animation:bob 1.2s ease-in-out infinite}
.loading.gone{opacity:0;pointer-events:none}
@keyframes bob{50%{transform:translateY(-8px)}}

.news-mode .chips,.news-mode .sub-actions,.news-mode .qr-wrap{display:none!important}
.shot:has(.shot-img){border:0;background:none;overflow:hidden}.shot-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:18px}
#pins{transition:opacity .5s}#pins.off{opacity:0;pointer-events:none}
.one .by{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:700}
.news-mode .shot{display:flex!important;flex-direction:column;gap:8px;aspect-ratio:auto;border:0;background:none;place-items:stretch}
.news{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:#f3f6f9;color:var(--ink);text-decoration:none;text-align:left}
.news i{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#1f3a5f;color:#fff;font-style:normal;font-family:var(--display)}
.news span{flex:1;min-width:0}.news b{display:block;font-size:14px;line-height:1.4;word-break:keep-all}.news small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}.news em{font-style:normal;color:var(--muted)}
.news-empty{padding:16px;color:var(--muted);font-size:13px}
.who{display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--accent,var(--orange))}
.sub-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sub-actions button{padding:12px 6px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--accent,#ff7a21) 35%,#fff);background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.qr-wrap{display:none;align-items:center;gap:12px;margin-top:12px;padding:10px;border-radius:16px;background:#f6f8f9}
.qr-wrap span{font-size:12px;color:var(--muted);line-height:1.5}.qr-wrap #cQr{flex:0 0 auto;padding:6px;background:#fff;border-radius:10px;line-height:0}
.guide{position:fixed;z-index:10;inset:0;display:grid;place-items:end center;padding:12px;background:rgba(20,40,55,.4)}
.gsheet{width:min(440px,100%);padding:20px;border-radius:26px;background:var(--paper-solid);box-shadow:0 18px 50px rgba(20,60,80,.3);margin-bottom:env(safe-area-inset-bottom,0px)}
.ghead{display:flex;align-items:flex-start;gap:10px}.ghead h3{word-break:keep-all;margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:24px}
.gdev{font-size:12px;font-weight:700;color:var(--muted)}
.gwarn{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff6dc;color:#7a5600;font-size:13px;line-height:1.5}
.gsteps{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.gsteps li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#f6f8f9}
.gsteps i{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:var(--ink);color:#fff;font-style:normal;font-family:var(--display);font-size:16px}
.gsteps b{display:block;font-size:15px}.gsteps small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.gsheet .go{display:flex}
.toast{position:fixed;z-index:11;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;background:rgba(35,48,59,.88);color:#fff;font-size:13px;word-break:break-all;text-align:center}
@media (min-width:760px){.qr-wrap{display:flex}.guide{place-items:center}}
@media (max-width:759px){.card h2{font-size:22px}.card-head img{width:54px}.shot{display:none}.card{padding:16px 16px 14px}.chips{margin:10px 0 0}}
@media (min-width:760px){
  .card{left:auto;right:20px;top:calc(env(safe-area-inset-top,0px) + 90px);bottom:20px;width:380px;max-height:none;transform:translateX(calc(100% + 40px))}
  .card.open{transform:none}
}
/* 걷기 모드: 들어가기 버튼, 조이스틱, 말 걸기, 대화창 */
.enter{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 58px);border:0;border-radius:999px;padding:14px 22px;background:var(--orange);color:#fff;font-size:15px;font-weight:700;box-shadow:0 10px 28px rgba(217,89,10,.35);cursor:pointer;white-space:nowrap}
.stick{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.32);border:2px solid rgba(255,255,255,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(20,60,80,.25);pointer-events:none}
.jump-btn{position:fixed;z-index:5;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:82px;height:82px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:var(--ink);font-size:26px;font-weight:700;line-height:1;box-shadow:0 10px 28px rgba(20,60,80,.25);display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
.jump-btn small{display:block;font-size:11px;margin-top:2px}.jump-btn.on{background:#ffe7a8}
.talk-btn{position:fixed;z-index:5;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);border:0;border-radius:999px;padding:16px 22px;background:var(--orange);color:#fff;font-size:16px;font-weight:700;box-shadow:0 10px 28px rgba(217,89,10,.35);cursor:pointer;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}}
body.walking .pin{pointer-events:none}
body.walking .credit{display:none}
body.walking .brand p{display:none}
body.walking .brand{padding:9px 14px 9px 10px}
body.walking .brand img{width:32px}
body.walking .brand h1{font-size:18px}
.brand h1{white-space:nowrap}
body.walking .hint{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 74px);white-space:normal;text-align:center;max-width:calc(100vw - 40px)}
.talk{position:fixed;z-index:9;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:520px;margin:0 auto;padding:16px;border-radius:26px;background:var(--paper-solid);box-shadow:0 18px 50px rgba(20,60,80,.3);animation:pop .25s ease-out}
.thead{display:flex;gap:10px;align-items:center}.thead img{width:52px;height:auto;flex:0 0 auto}
.thead b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1}.thead small{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--accent,var(--orange))}
.thead .x{margin-left:auto}
.tmsg{margin:12px 2px 14px;font-size:15px;line-height:1.65;word-break:keep-all;min-height:3.3em}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topts button,.topts a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 12px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--accent,#ff7a21) 30%,#fff);background:#fff;color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;text-align:center;word-break:keep-all;cursor:pointer}
.topts .main{background:var(--accent,var(--orange));border-color:transparent;color:#fff}
.topts .wide{grid-column:1/-1;justify-content:flex-start;text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
/* 하늘 색: 광주의 해 뜨고 지는 시각에 맞춰 아침·낮·노을·밤을 고릅니다. 주소 끝에 ?sky=day|dawn|dusk|night 를 붙이면 미리 볼 수 있어요. */
window.SKY=(function(){
  /* 달마다(15일 기준) 해 뜨는·지는 시각, 분 단위 */
  var SUN=[[460,1065],[437,1094],[402,1119],[361,1142],[328,1166],[318,1187],[329,1187],[351,1161],[373,1120],[395,1080],[422,1047],[447,1041]];
  /* top·bot 하늘 위아래, fog 먼 곳 색, hs·hg·hi 하늘빛, sc·si·sx·sy·sz 해(달)빛과 방향, night 불빛 세기, star 별, sh 그림자 진하기 */
  var PAL={
    day:{top:0x9fd8f2,bot:0xe9f7fb,fog:0xdff2f8,hs:0xffffff,hg:0x8fb98a,hi:.85,sc:0xfff1dc,si:.75,sx:30,sy:50,sz:20,night:0,star:0,sh:.34,foam:0xffffff,water:0x1f7a99,sea:0x56b9d8,dark:0},
    dawn:{top:0x8fb8e8,bot:0xffdcc8,fog:0xf6ddd0,hs:0xffeadc,hg:0x8fa58a,hi:.8,sc:0xffc9a0,si:.62,sx:48,sy:17,sz:16,night:.3,star:0,sh:.24,foam:0xfff3ea,water:0x2a7f97,sea:0x5cb4cf,dark:0},
    dusk:{top:0x6f86c9,bot:0xffb98a,fog:0xf3bfa0,hs:0xffd9bd,hg:0x8a8478,hi:.76,sc:0xff9455,si:.72,sx:-48,sy:15,sz:18,night:.55,star:0,sh:.26,foam:0xffe6d4,water:0x256f8c,sea:0x4d9cbd,dark:0},
    night:{top:0x0e1a3c,bot:0x2c4272,fog:0x263a66,hs:0xa3b6f0,hg:0x33426a,hi:.74,sc:0xb8c8ff,si:.34,sx:-22,sy:45,sz:26,night:1,star:1,sh:.14,foam:0x8fa3c8,water:0x0f3550,sea:0x2a6690,dark:1}};
  function mixC(a,b,t){var r=(a>>16&255)+((b>>16&255)-(a>>16&255))*t,g=(a>>8&255)+((b>>8&255)-(a>>8&255))*t,l=(a&255)+((b&255)-(a&255))*t;return Math.round(r)<<16|Math.round(g)<<8|Math.round(l);}
  function mix(a,b,t){var o={},k;for(k in a)o[k]=k==="top"||k==="bot"||k==="fog"||k==="hs"||k==="hg"||k==="sc"||k==="foam"||k==="water"||k==="sea"?mixC(a[k],b[k],t):a[k]+(b[k]-a[k])*t;return o;}
  var forced=(/[?&]sky=(day|dawn|dusk|night)/.exec(location.search)||[])[1];
  function now(){
    if(forced)return mix(PAL[forced],PAL[forced],0);
    var d=new Date(Date.now()+9*3600e3),m=d.getUTCMonth(),day=d.getUTCDate(),min=d.getUTCHours()*60+d.getUTCMinutes();
    var a=day>=15?m:(m+11)%12,f=(day>=15?day-15:day+15)/30,A=SUN[a],B=SUN[(a+1)%12],R=A[0]+(B[0]-A[0])*f,S=A[1]+(B[1]-A[1])*f;
    var K=[[R-60,"night"],[R-5,"dawn"],[R+55,"day"],[S-75,"day"],[S-10,"dusk"],[S+45,"night"]];
    if(min<=K[0][0]||min>=K[5][0])return mix(PAL.night,PAL.night,0);
    for(var i=0;i<5;i++)if(min<K[i+1][0])return mix(PAL[K[i][1]],PAL[K[i+1][1]],(min-K[i][0])/(K[i+1][0]-K[i][0]));
    return mix(PAL.night,PAL.night,0);
  }
  function hex(c){return "#"+("00000"+c.toString(16)).slice(-6);}
  function css(p){var s=document.documentElement.style;s.setProperty("--sky-top",hex(p.top));s.setProperty("--sky-bottom",hex(p.bot));s.setProperty("--credit",p.dark>.5?"rgba(255,255,255,.55)":"rgba(35,48,59,.45)");
    var t=document.querySelector('meta[name="theme-color"]');if(t)t.content=hex(p.top);}
  var cur=now();css(cur);
  return {now:now,css:css,cur:cur};
})();
</script>

<div id="stage"></div>
<div class="loading" id="loading"><img alt="" id="loadImg"></div>

<div class="top">
  <div class="brand"><img alt="" id="brandImg"><div><h1>서구 아일랜드</h1><p>직원이 만든 생활 도구 9곳</p></div></div>

/* ---------- render loop: runs every frame while walking, otherwise only while something moves ---------- */
let rafId=0,lastIdle=0,idleUntil=0,lastT=0,wasUnder=false;const airFog=scene.fog,waterFog=new THREE.Fog(0x1f7a99,.5,20);
function requestRender(){if(!rafId)rafId=requestAnimationFrame(frame);}
/* ---------- 하늘: 시각에 맞춰 빛·안개·창문 불빛·별·그림자를 바꿈(1분마다 다시 계산) ---------- */
function applySky(){const p=SKY.now();SKY.cur=p;SKY.css(p);
  airFog.color.setHex(p.fog);waterFog.color.setHex(p.water);hemi.color.setHex(p.hs);hemi.groundColor.setHex(p.hg);hemi.intensity=p.hi;sun.color.setHex(p.sc);sun.intensity=p.si;sun.position.set(p.sx,p.sy,p.sz);
  WIN.emissiveIntensity=p.night;front.material.emissiveIntensity=p.night*.9;HALO.opacity=p.night*.75;HALOS.forEach(s=>s.visible=p.night>.02);foam.material.color.setHex(p.foam);seaMat.color.setHex(p.sea);
  starMat.opacity=p.star;moonMat.opacity=p.star;skyDome.visible=p.star>.02;layShadows(p);
  if(wasUnder)renderer.setClearColor(waterFog.color,1);}
applySky();setInterval(()=>{applySky();requestRender();},60000);
function startTween(fast){tweening=true;idleUntil=performance.now()+(fast?400:1600);requestRender();}
/* 느린 기기 보호: 몇 초 동안 계속 버벅이면(1초에 23장 아래) 그림자를 끄고 화면 선명도를 한 단계씩 낮춤. 다시 올리지는 않음 */
const QUAL={n:0,step:0,t0:0,off:/[?&]q=high/.test(location.search)};
function watchSpeed(raw,t){if(QUAL.off||QUAL.step>1)return;if(!QUAL.t0||raw>.3){QUAL.t0=t+(QUAL.t0?0:6000);QUAL.n=0;return;}if(t<QUAL.t0)return;QUAL.n++;
  if(t-QUAL.t0>=4000){if(QUAL.n<92){QUAL.step++;shRound.visible=shRect.visible=false;renderer.setPixelRatio(Math.min(devicePixelRatio||1,QUAL.step>1?1:1.25));renderer.setSize(innerWidth,innerHeight);QUAL.t0=t+3000;}else QUAL.t0=t;QUAL.n=0;}}
function frame(t){
  rafId=0;const raw=lastT?(t-lastT)/1000:.016,dt=Math.min(.05,raw),s=t/1000;lastT=t;let moving=false;watchSpeed(raw,t);
  if(INTRO.on)stepIntro(dt);
  else if(walking){updatePlayer(dt);updateWalkCam(dt);}
  else{const k=dragging||pointers.size>1?0.35:0.09;
    for(const key of ["tx","ty","tz","dist","az","el","ox","oy"]){const d=goal[key]-rig[key];if(Math.abs(d)>1e-4){rig[key]+=d*k;moving=true;}else rig[key]=goal[key];}
    placeCamera();}
  const fov=walking?55:40;if(Math.abs(camera.fov-fov)>.05){camera.fov+=(fov-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();moving=true;}
  // gentle ambient life (walkers, clouds, bells, boat) — skipped for reduced motion
  if(!reduce){updateWalkers(dt);clouds.forEach(c=>{c.position.x+=0.01;if(c.position.x>90)c.position.x=-90;});boat.position.y=-0.3+Math.sin(s*1.4)*0.08;boat.rotation.z=Math.sin(s*1.1)*0.04;sail.position.y=-0.3+Math.sin(s*1.25+1)*0.08;sail.rotation.x=Math.sin(s*.95+.5)*0.035;stepGulls(dt,s);
    zoneBy.bell.group.userData.glows.forEach((h,i)=>{h.material.opacity=0.35+0.45*(0.5+0.5*Math.sin(s*3+i));});zoneBy.seoguon.group.userData.ring.rotation.z=s*.6;JC.statue.userData.beam.rotation.z=Math.sin(s*.9)*.06;{const g=zoneBy.bus.group.userData,b=g.bus;g.busA+=dt*.32;b.position.x=Math.sin(g.busA)*4.4;b.position.z=Math.cos(g.busA)*4.4;b.rotation.y=g.busA+Math.PI/2;}const sp=zoneBy.family.group.userData.spin;if(sp)sp.rotation.y=s*0.8;foam.material.opacity=0.4+0.15*Math.sin(s*1.3);}
  if(!reduce){seaU.value=s;stepDolphins(dt);}
  {const under=camera.position.y<SEA_Y-.05;if(under!==wasUnder){wasUnder=under;scene.fog=under?waterFog:airFog;renderer.setClearColor(under?waterFog.color:0x000000,under?1:0);eco.visible=under;sndUnder(under);}if(under)stepEco(reduce?0:s);}
  updateNpcs(dt,s);animHaeon(player,dt,s);NPCS.forEach(n=>animHaeon(n.h,dt,s));walkers.forEach(w=>animHaeon(w.h,dt,s));
  if(skyDome.visible)skyDome.position.copy(camera.position);
  renderer.render(scene,camera);updatePins();
  if(walking||INTRO.on){requestRender();return;}
  const now=performance.now();
  if(moving||dragging||now<idleUntil){requestRender();return;}
  // idle: keep ambient motion smooth (every frame), pause when hidden or in list view
  if(!reduce&&!document.hidden&&$("list").hidden)requestRender();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)requestRender();});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(focus<0&&!walking&&!INTRO.on&&atOverview){Object.assign(goal,overGoal());}startTween();});

/* ---------- daily news for the banners ---------- */
function applyNews(){banners.forEach((m,k)=>{const old=m.material.map;m.material.map=bannerTex((NEWS.items||[])[k],k);m.material.needsUpdate=true;if(old)old.dispose();});if(focus===HALL_I)fillHallCard();requestRender();}
applyNews();
// 현수막 뉴스: 이 저장소의 news.json 과 예전 경로(seogu-bapsang/island/news.json) 중 더 최신 것을 씁니다
if(location.protocol.startsWith("http")){const getNews=u=>fetch(u+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
  Promise.all([getNews("./news.json"),getNews("/seogu-bapsang/island/news.json")]).then(ds=>{const ok=ds.filter(d=>d&&Array.isArray(d.items)&&d.items.length).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));if(ok[0]&&String(ok[0].updated)>=String(NEWS.updated||"")){NEWS=ok[0];applyNews();}});}
/* ---------- intro: 하늘 높이에서 구름을 뚫고 내려와 서구청 앞에 멈춤(누르면 건너뜀) ---------- */
function overHint(){return innerWidth<760?"섬을 끌어서 돌려보고, 숫자를 눌러보세요":"섬을 끌어서 돌려보고, 이름표를 눌러보세요";}
const INTRO={on:false,t0:0,dur:3800,to:null};
function sstep(x){x=clamp(x,0,1);return x*x*(3-2*x);}
function introPose(u){const to=INTRO.to||hallView(),io=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  return {tx:to.tx,ty:to.ty,tz:to.tz,ox:0,oy:0,dist:160+(to.dist-160)*io,el:1.5+(to.el-1.5)*sstep((u-.3)/.7),az:to.az+1.1*(1-sstep(u))};}
function startIntro(){INTRO.to=hallView();if(reduce){Object.assign(rig,INTRO.to);Object.assign(goal,INTRO.to);showHint(overHint(),6000);requestRender();return;}
  INTRO.on=true;INTRO.t0=-250;$("enterBtn").hidden=true;introClouds.visible=true;renderer.compile(scene,camera);introMat.opacity=.95;$("pins").classList.add("off");requestRender();}
function endIntro(){if(!INTRO.on)return;INTRO.on=false;introClouds.visible=false;const v=INTRO.to||hallView();Object.assign(rig,v);Object.assign(goal,v);
  $("pins").classList.remove("off");$("enterBtn").hidden=walking||focus>=0||!$("list").hidden;showHint(overHint(),6000);startTween();}
function stepIntro(dt){INTRO.t0+=Math.min(dt,1/30)*1000;const u=clamp(INTRO.t0/INTRO.dur,0,1);Object.assign(rig,introPose(u));introMat.opacity=.95*(1-sstep((u-.82)/.18));placeCamera();if(u>=1)endIntro();}
$("hint").style.opacity=0;$("pins").classList.add("off");
INTRO.to=hallView();Object.assign(rig,introPose(0));placeCamera();
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.then(()=>{$("loading").classList.add("gone");startIntro();});
requestRender();
})();
</script>
